[package]
name = "tauri-plugin-fors-msal"
version = "0.1.0"
edition = "2021"
description = "Azure AD SSO for Tauri mobile via native MSAL Android SDK"
license = "MIT OR Apache-2.0"
repository = "https://github.com/giraudsa/tauri-plugin-fors-msal"
links = "tauri-plugin-fors-msal"

[lib]
name = "tauri_plugin_fors_msal"
crate-type = ["lib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }